# ~/.config/hypr/hypridle.conf
# Auto-lock is OFF: locking + screen-off together left hyprlock dead ("oopsie")
# on wake. Lock manually with Super+L. Only the screen turns off when idle.
general {
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 600                 # 10 min idle -> screen off (no lock)
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
