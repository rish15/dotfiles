# ~/.config/hypr/hyprland.conf — port of Rishu's Sway config

### Variables
$mod  = SUPER
$term = alacritty
$menu = rofi -show drun

### Monitors (external preferred; laptop handled by display-watch.sh)
monitor = HDMI-A-1, preferred, auto, 1
monitor = eDP-1, preferred, auto, 1
monitor = , preferred, auto, 1

### Autostart
exec-once = dex --autostart --environment Hyprland
exec-once = nm-applet --indicator
exec-once = pasystray
exec-once = waybar
exec-once = swaybg -i ~/Pictures/wallpaper.jpg -m fill
exec-once = wl-paste --watch cliphist store
exec-once = gammastep -l geoclue2
exec-once = hypridle
exec-once = ~/.config/hypr/scripts/display-watch.sh

### Env (Wayland-native apps)
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = GTK_THEME,Materia-dark

### Input
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        tap-to-click = true
        natural_scroll = true
    }
}

### Look & feel
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faee)
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

animations {
    enabled = true
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
}

### Transparency (was: for_window [app_id="Alacritty"] opacity 0.92)
windowrule = opacity 0.92 0.92, class:^(Alacritty)$
# windowrule = opacity 0.95 0.95, class:.*   # global transparency

### Key bindings
bind = $mod, Return, exec, $term
bind = $mod SHIFT, Q, killactive
bind = $mod, D, exec, $menu
bind = $mod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, E, exit
bind = $mod SHIFT, X, exec, hyprlock
bind = $mod, F, fullscreen
bind = $mod SHIFT, space, togglefloating
bind = $mod, N, exec, pkill gammastep || gammastep -l geoclue2

# Screenshots
bind = , Print, exec, grim ~/Pictures/screenshot-$(date +%F-%H%M%S).png
bind = $mod, Print, exec, sh -c 'f=~/Pictures/screenshot-$(date +%F-%H%M%S).png; grim -g "$(slurp)" "$f" && wl-copy < "$f"'
bind = $mod SHIFT, S, exec, flameshot gui

# Gaps (was $mod+[ / ] and Shift variants)
bind = $mod, bracketleft,        exec, hyprctl keyword general:gaps_in $(( $(hyprctl getoption general:gaps_in -j | jq -r '.custom' | cut -d' ' -f1) - 2 ))
bind = $mod, bracketright,       exec, hyprctl keyword general:gaps_in $(( $(hyprctl getoption general:gaps_in -j | jq -r '.custom' | cut -d' ' -f1) + 2 ))
bind = $mod SHIFT, bracketleft,  exec, hyprctl keyword general:gaps_out $(( $(hyprctl getoption general:gaps_out -j | jq -r '.custom' | cut -d' ' -f1) - 2 ))
bind = $mod SHIFT, bracketright, exec, hyprctl keyword general:gaps_out $(( $(hyprctl getoption general:gaps_out -j | jq -r '.custom' | cut -d' ' -f1) + 2 ))

# Focus / move
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Workspaces 1-5
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Mouse move/resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Resize mode (was $mod+r)
bind = $mod, R, submap, resize
submap = resize
binde = , right, resizeactive, 20 0
binde = , left,  resizeactive, -20 0
binde = , up,    resizeactive, 0 -20
binde = , down,  resizeactive, 0 20
bind  = , escape, submap, reset
bind  = , Return, submap, reset
submap = reset

# Media keys
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
