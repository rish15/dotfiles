# ~/.config/hypr/hyprlock.conf — replaces the grim+convert blur lock script
background {
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    size = 250, 50
    position = 0, -80
    halign = center
    valign = center
    outline_thickness = 2
    placeholder_text = Password...
}

label {
    text = $TIME
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}
