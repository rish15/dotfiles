# ~/.config/hypr/hypridle.conf
# No auto-lock and no idle screen-off.
# Why: the Acer DP monitor fully disconnects when its screen is turned off. If the
# laptop panel is off at that moment, Hyprland has no outputs left, swaps in a
# temporary FALLBACK output, and hyprlock crashes on it ("oopsie"). Keeping the
# screen powered avoids that. The monitor's own power saving still applies.
general {
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
