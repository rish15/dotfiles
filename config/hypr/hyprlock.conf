# ~/.config/hypr/hyprlock.conf — Catppuccin Mocha
$base     = rgb(1e1e2e)
$surface0 = rgb(313244)
$text     = rgb(cdd6f4)
$subtext  = rgb(a6adc8)
$mauve    = rgb(cba6f7)
$blue     = rgb(89b4fa)
$red      = rgb(f38ba8)
$yellow   = rgb(f9e2af)
$font     = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 2
}

background {
    # static wallpaper (set up by scripts/wallpaper.sh); "screenshot" here can
    # crash hyprlock when a screen is off/disabled at lock time
    path = ~/.cache/lockscreen.jpg
    color = $base
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    vibrancy = 0.2
}

# Time
label {
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font ExtraBold
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext
    font_size = 20
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}

# User
label {
    text =   $USER
    color = $mauve
    font_size = 14
    font_family = $font Bold
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    size = 300, 52
    outline_thickness = 2
    rounding = 16
    outer_color = $mauve $blue 45deg
    inner_color = $surface0
    font_color = $text
    check_color = $yellow
    fail_color = $red
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    placeholder_text = <span foreground="##a6adc8">  Password…</span>
    dots_center = true
    fade_on_empty = false
    position = 0, -90
    halign = center
    valign = center
}
